<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il mio agente spese</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body{font-family:Arial,sans-serif;max-width:520px;margin:25px auto;padding:18px;background:#f4f6f8;color:#222}
    h1{font-size:25px}
    button,input,select{box-sizing:border-box;width:100%;padding:13px;margin:7px 0 12px;font-size:16px;border-radius:8px;border:1px solid #bbb}
    button{background:#1769aa;color:white;border:0;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .pannello{background:white;padding:16px;border-radius:12px;margin-top:18px}
    #modulo{display:none}
    #messaggio{white-space:pre-wrap;overflow-wrap:anywhere}
    .saldi{display:grid;grid-template-columns:1fr;gap:10px}
    .saldo{display:flex;justify-content:space-between;gap:12px;padding:12px;background:#f4f6f8;border-radius:8px}
    .saldo strong{font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
  <h1>🎙️ Il mio agente spese</h1>
  <p>Premi il pulsante e raccontami la spesa con una frase.</p>
  <button id="microfono" type="button">🎙️ Parla</button>
  <p id="messaggio">Pronto ad ascoltare.</p>

  <div class="pannello">
    <h2>💶 Saldo dei conti</h2>
    <div id="saldi" class="saldi">
      <div class="saldo"><span>Contanti</span><strong>—</strong></div>
      <div class="saldo"><span>Carta ADI</span><strong>—</strong></div>
      <div class="saldo"><span>Carta Pipino</span><strong>—</strong></div>
    </div>
    <button id="aggiornaSaldi" type="button">Aggiorna saldi</button>
    <p id="messaggioSaldi" aria-live="polite">Premi “Aggiorna saldi” per leggere i saldi aggiornati.</p>
  </div>

  <div id="modulo" class="pannello">
    <h2>Controlla il movimento</h2>

    <label for="descrizione">Descrizione</label>
    <input id="descrizione" placeholder="Es. Spesa da Pewex">

    <label for="importo">Importo (€)</label>
    <input id="importo" type="number" min="0.01" step="0.01">

    <label for="tipo">Tipo di movimento</label>
    <select id="tipo">
      <option>Uscita</option>
      <option>Entrata</option>
      <option>Trasferimento</option>
    </select>

    <label for="categoria">Categoria</label>
    <select id="categoria">
      <option value="">Seleziona categoria</option>
      <option>Alimentari</option><option>Casa</option>
      <option>Trasporti</option><option>Salute</option>
      <option>Svago</option><option>Abbigliamento</option>
      <option>Bollette</option><option>Stipendio</option><option>Altro</option>
    </select>

    <label for="pagamento">Pagamento</label>
    <select id="pagamento">
      <option>Carta</option><option>Contanti</option>
      <option>Bonifico</option><option>Altro</option>
    </select>

    <label for="conto">Conto utilizzato / di partenza</label>
    <select id="conto">
      <option value="">Seleziona il conto</option>
      <option>Contanti</option><option>Carta ADI</option><option>Carta Pipino</option>
    </select>

    <div id="destinazioneBox" style="display:none">
      <label for="destinazione">Conto di destinazione</label>
      <select id="destinazione">
        <option value="">Seleziona il conto di destinazione</option>
        <option>Contanti</option><option>Carta ADI</option><option>Carta Pipino</option>
      </select>
    </div>

    <label for="note">Note (facoltative)</label>
    <input id="note" placeholder="Eventuali dettagli">

    <button id="conferma" type="button">Conferma e salva nel foglio</button>
  </div>

<script>
const CLIENT_ID = '546112326643-fftndpifuam4t9kjk84t9k1o3bh7tgpc.apps.googleusercontent.com';
const SPREADSHEET_ID = '1ryuKPPY0cqozL3EFTwZRbTx7b95XKdOQfKxWVCBHqYY';
const SHEET_NAME = 'Il mio agente spese';
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets';

const $ = id => document.getElementById(id);
const messaggio = $('messaggio');
const modulo = $('modulo');
let tokenClient;
let tokenInAttesa = false;
let azioneToken = 'salva';

$('tipo').addEventListener('change', () => {
  $('destinazioneBox').style.display =
    $('tipo').value === 'Trasferimento' ? 'block' : 'none';
});

function analizzaFrase(testo) {
  const frase = testo.trim();
  const minuscola = frase.toLowerCase()
    .replace(/[’]/g, "'");

  // Importo: 10, 10 euro, 10,50 euro, 10.50 €
  const matchImporto = minuscola.match(
    /(?:^|\s)(\d+(?:[.,]\d{1,2})?)(?=\s*(?:euro|eur|€)?(?:\s|$))/i
  );

  $('importo').value = matchImporto
    ? matchImporto[1].replace(',', '.')
    : '';

  // Riconoscimento del tipo di movimento
  const trasferimento =
    /\b(trasferimento|giroconto|spostato|sposta|trasferisci)\b/i.test(minuscola);

  const entrata =
    /\b(entrata|incassato|ricevuto|ricevuta|stipendio|rimborso|accredito)\b/i.test(minuscola);

  $('tipo').value = trasferimento
    ? 'Trasferimento'
    : entrata ? 'Entrata' : 'Uscita';

  // Riconoscimento del conto
  if (/carta\s+adi/i.test(minuscola)) {
    $('conto').value = 'Carta ADI';
    $('pagamento').value = 'Carta';
  } else if (/carta\s+pipino/i.test(minuscola)) {
    $('conto').value = 'Carta Pipino';
    $('pagamento').value = 'Carta';
  } else if (/\b(contanti|in contante)\b/i.test(minuscola)) {
    $('conto').value = 'Contanti';
    $('pagamento').value = 'Contanti';
  } else {
    $('conto').value = '';
  }

  // Riconoscimento della destinazione nei trasferimenti
  const conti = ['Contanti', 'Carta ADI', 'Carta Pipino'];
  const destinazione = conti.find(conto =>
    minuscola.includes('verso ' + conto.toLowerCase()) ||
    minuscola.includes('a ' + conto.toLowerCase()) ||
    minuscola.includes('su ' + conto.toLowerCase())
  );

  $('destinazione').value = destinazione || '';
  $('tipo').dispatchEvent(new Event('change'));

  // Categorie automatiche
  const categorie = [
    [/pewex|supermercato|alimentari|spesa|market/i, 'Alimentari'],
    [/affitto|mobili|casa|arredamento/i, 'Casa'],
    [/benzina|carburante|autobus|treno|taxi|parcheggio/i, 'Trasporti'],
    [/farmacia|medico|visita|dentista/i, 'Salute'],
    [/cinema|ristorante|bar|vacanza|svago/i, 'Svago'],
    [/vestiti|scarpe|abbigliamento/i, 'Abbigliamento'],
    [/bolletta|luce|gas|acqua|internet/i, 'Bollette'],
    [/stipendio/i, 'Stipendio']
  ];

  const categoriaTrovata = categorie.find(([regex]) => regex.test(minuscola));
  $('categoria').value = categoriaTrovata
    ? categoriaTrovata[1]
    : (entrata ? 'Altro' : '');

  // Descrizione ripulita
  let descrizione = frase
    .replace(/\b(ho speso|ho pagato|ho acquistato|ho comprato|ho incassato|ho ricevuto|ho trasferito|trasferisci|sposta|spostato|giroconto|trasferimento|entrata|uscita)\b/ig, '')
    .replace(/\d+(?:[.,]\d{1,2})?\s*(?:euro|eur|€)?/ig, '')
    .replace(/\b(con la carta|con carta|carta)\s*(adi|pipino)\b/ig, '')
    .replace(/\b(in contanti|con contanti|contanti|in contante)\b/ig, '')
    .replace(/\s+/g, ' ')
    .trim();

  $('descrizione').value = descrizione
    ? descrizione.charAt(0).toUpperCase() + descrizione.slice(1)
    : 'Movimento da descrivere';

  modulo.style.display = 'block';
  messaggio.textContent =
    'Ho interpretato: "' + frase + '".\n' +
    'Controlla descrizione, importo, tipo e conto. ' +
    'Se qualcosa non è corretto, modificalo prima di salvare.';
}
function creaTokenClient(azione = 'salva') {
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    messaggio.textContent = 'Google non è ancora pronto. Riprova tra qualche secondo.';
    tokenInAttesa = false;
    $('conferma').disabled = false;
    return;
  }
  azioneToken = azione;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: async risposta => {
      if (risposta.error || !risposta.access_token) {
        messaggio.textContent = 'Autorizzazione Google non riuscita. Riprova.';
        tokenInAttesa = false;
        $('conferma').disabled = false;
        return;
      }
      if (azioneToken === 'saldi') {
        await caricaSaldi(risposta.access_token);
      } else {
        await salvaNelFoglio(risposta.access_token);
      }
    }
  });
}

async function salvaNelFoglio(token) {
  const tipo = $('tipo').value;
  const conto = $('conto').value;
  const destinazione = $('destinazione').value;

  const riga = [
    (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString()),
    new Date().toISOString(),
    $('descrizione').value.trim(),
    Number($('importo').value),
    tipo,
    $('categoria').value,
    $('pagamento').value,
    conto,
    $('note').value.trim(),
    tipo === 'Trasferimento' ? destinazione : '',
    'Confermato'
  ];

  const url = 'https://sheets.googleapis.com/v4/spreadsheets/' +
    SPREADSHEET_ID + '/values/' +
    encodeURIComponent("'" + SHEET_NAME + "'!A:K") +
    ':append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS';

  try {
    const risposta = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ values: [riga] })
    });
    const risultato = await risposta.json();
    if (!risposta.ok) {
      throw new Error(risultato.error?.message || 'Errore API Google Sheets');
    }
    messaggio.textContent = '✅ Movimento salvato nel foglio Google!\n' +
      $('descrizione').value + ' — ' + Number($('importo').value).toFixed(2) +
      ' €\nConto: ' + conto + '\nTipo: ' + tipo;
    modulo.style.display = 'none';
    $('note').value = '';
    // Aggiorna automaticamente i saldi usando lo stesso token Google.
    await caricaSaldi(token);
  } catch (errore) {
    messaggio.textContent = '❌ Salvataggio non riuscito: ' + errore.message +
      '\nControlla autorizzazioni e configurazione Google.';
  } finally {
    tokenInAttesa = false;
    $('conferma').disabled = false;
  }
}

$('conferma').addEventListener('click', () => {
  const descrizione = $('descrizione').value.trim();
  const importo = Number($('importo').value);
  const conto = $('conto').value;
  const tipo = $('tipo').value;

  if (!descrizione || !Number.isFinite(importo) || importo <= 0 || !conto) {
    messaggio.textContent = 'Inserisci descrizione, importo positivo e conto.';
    return;
  }
  if (tipo === 'Trasferimento' &&
      (!$('destinazione').value || $('destinazione').value === conto)) {
    messaggio.textContent = 'Per il trasferimento scegli un conto di destinazione diverso da quello di partenza.';
    return;
  }
  if (tokenInAttesa) return;

  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    messaggio.textContent = 'Attendi qualche secondo e riprova: Google sta caricando.';
    return;
  }

  tokenInAttesa = true;
  $('conferma').disabled = true;
  messaggio.textContent = 'Richiesta autorizzazione Google...';
  creaTokenClient();
  if (tokenClient) tokenClient.requestAccessToken();
});

async function caricaSaldi(token) {
  const messaggioSaldi = $('messaggioSaldi');
  const boxSaldi = $('saldi');
  messaggioSaldi.textContent = 'Lettura dei saldi in corso...';
  const base = 'https://sheets.googleapis.com/v4/spreadsheets/' + SPREADSHEET_ID + '/values/';
  try {
    const [risConti, risMovimenti] = await Promise.all([
      fetch(base + encodeURIComponent("'Conti'!A:D"), { headers: { Authorization: 'Bearer ' + token } }),
      fetch(base + encodeURIComponent("'" + SHEET_NAME + "'!A:K"), { headers: { Authorization: 'Bearer ' + token } })
    ]);
    const datiConti = await risConti.json();
    const datiMovimenti = await risMovimenti.json();
    if (!risConti.ok) throw new Error(datiConti.error?.message || 'Impossibile leggere la scheda Conti.');
    if (!risMovimenti.ok) throw new Error(datiMovimenti.error?.message || 'Impossibile leggere i movimenti.');
    const righeConti = datiConti.values || [];
    const righeMovimenti = datiMovimenti.values || [];
    const saldi = {};
    for (let i = 1; i < righeConti.length; i++) {
      const nome = String(righeConti[i][0] || '').trim();
      const iniziale = Number(String(righeConti[i][2] ?? '0').replace(',', '.')) || 0;
      if (nome) saldi[nome] = iniziale;
    }
    for (let i = 1; i < righeMovimenti.length; i++) {
      const r = righeMovimenti[i];
      if (String(r[10] || '').trim().toLowerCase() !== 'confermato') continue;
      const importo = Number(String(r[3] || '0').replace(',', '.')) || 0;
      const tipo = String(r[4] || '').trim().toLowerCase();
      const conto = String(r[7] || '').trim();
      const destinazione = String(r[9] || '').trim();
      if (tipo === 'uscita' && Object.prototype.hasOwnProperty.call(saldi, conto)) saldi[conto] -= importo;
      else if (tipo === 'entrata' && Object.prototype.hasOwnProperty.call(saldi, conto)) saldi[conto] += importo;
      else if (tipo === 'trasferimento') {
        if (Object.prototype.hasOwnProperty.call(saldi, conto)) saldi[conto] -= importo;
        if (Object.prototype.hasOwnProperty.call(saldi, destinazione)) saldi[destinazione] += importo;
      }
    }
    boxSaldi.replaceChildren();
    ['Contanti', 'Carta ADI', 'Carta Pipino'].forEach(nome => {
      const riga = document.createElement('div'); riga.className = 'saldo';
      const etichetta = document.createElement('span'); etichetta.textContent = nome;
      const valore = document.createElement('strong');
      valore.textContent = Object.prototype.hasOwnProperty.call(saldi, nome)
        ? saldi[nome].toLocaleString('it-IT', { style: 'currency', currency: 'EUR' }) : 'Conto non trovato';
      riga.append(etichetta, valore); boxSaldi.appendChild(riga);
    });
    messaggioSaldi.textContent = 'Saldi aggiornati. I movimenti non confermati sono esclusi.';
  } catch (errore) {
    messaggioSaldi.textContent = 'Errore nella lettura dei saldi: ' + errore.message;
  } finally { $('aggiornaSaldi').disabled = false; }
}

$('aggiornaSaldi').addEventListener('click', () => {
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    $('messaggioSaldi').textContent = 'Google sta caricando. Riprova tra qualche secondo.'; return;
  }
  $('aggiornaSaldi').disabled = true;
  creaTokenClient('saldi');
  if (tokenClient) tokenClient.requestAccessToken();
});

// Attiva il riconoscimento vocale nei browser compatibili (es. Chrome).
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const riconoscimento = new SpeechRecognition();
  riconoscimento.lang = 'it-IT';
  riconoscimento.continuous = false;
  riconoscimento.interimResults = false;
  $('microfono').addEventListener('click', () => {
    try { messaggio.textContent = 'Ti ascolto...'; riconoscimento.start(); }
    catch (e) { messaggio.textContent = 'Il microfono è già attivo. Parla adesso.'; }
  });
  riconoscimento.onresult = evento => analizzaFrase(evento.results[0][0].transcript);
  riconoscimento.onerror = evento => {
    messaggio.textContent = evento.error === 'not-allowed'
      ? 'Microfono bloccato: consenti l’accesso al microfono nelle impostazioni del browser.'
      : 'Non sono riuscito ad ascoltare (' + evento.error + '). Premi Parla e riprova.';
  };
  riconoscimento.onend = () => { if (messaggio.textContent === 'Ti ascolto...') messaggio.textContent = 'Non ho sentito una frase. Premi Parla e riprova.'; };
} else {
  $('microfono').addEventListener('click', () => {
    messaggio.textContent = 'Il riconoscimento vocale non è supportato da questo browser. Prova con Google Chrome e consenti il microfono.';
  });
}

</script>
</body>
</html>
