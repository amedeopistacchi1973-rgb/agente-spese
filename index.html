
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il mio agente spese</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 25px auto;
      padding: 18px;
      background: #f4f6f8;
      color: #222;
    }
    h1 { font-size: 25px; }
    button, input, select {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #bbb;
    }
    button {
      background: #1769aa;
      color: white;
      border: 0;
      cursor: pointer;
    }
    .pannello {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-top: 18px;
    }
    #modulo { display: none; }
    #messaggio { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🎙️ Il mio agente spese</h1>
  <p>Premi il pulsante e raccontami la spesa con una frase.</p>

  <button id="microfono" type="button">🎙️ Parla</button>
  <p id="messaggio">Pronto ad ascoltare.</p>

  <div id="modulo" class="pannello">
    <h2>Controlla la spesa</h2>

    <label for="descrizione">Descrizione</label>
    <input id="descrizione" placeholder="Es. Spesa da Pewex">

    <label for="importo">Importo (€)</label>
    <input id="importo" type="number" min="0.01" step="0.01">

    <label for="tipo">Tipo di movimento</label>
    <select id="tipo">
      <option>Uscita</option>
      <option>Entrata</option>
      <option>Trasferimento</option>
    </select>

    <label for="categoria">Categoria</label>
    <select id="categoria">
      <option value="">Seleziona categoria</option>
      <option>Alimentari</option>
      <option>Casa</option>
      <option>Trasporti</option>
      <option>Salute</option>
      <option>Svago</option>
      <option>Abbigliamento</option>
      <option>Bollette</option>
      <option>Stipendio</option>
      <option>Altro</option>
    </select>

    <label for="pagamento">Pagamento</label>
    <select id="pagamento">
      <option>Carta</option>
      <option>Contanti</option>
      <option>Bonifico</option>
      <option>Altro</option>
    </select>

    <label for="conto">Conto utilizzato</label>
    <select id="conto">
      <option value="">Seleziona il conto</option>
      <option>Contanti</option>
      <option>Carta ADI</option>
      <option>Carta Pipino</option>
    </select>

    <label for="note">Note (facoltative)</label>
    <input id="note" placeholder="Eventuali dettagli">

    <button id="conferma" type="button">Conferma i dati</button>
  </div>

  <script>
    const messaggio = document.getElementById('messaggio');
    const modulo = document.getElementById('modulo');

    function analizzaFrase(testo) {
      const frase = testo.trim();
      const minuscola = frase.toLowerCase();

      const corrispondenzaImporto =
        minuscola.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:euro|eur|€)?/);

      const importo = corrispondenzaImporto
        ? corrispondenzaImporto[1].replace(',', '.')
        : '';

      let descrizione = frase
        .replace(/ho speso|ho pagato|ho acquistato/ig, '')
        .replace(/\d+(?:[.,]\d{1,2})?\s*(?:euro|eur|€)?/ig, '')
        .replace(/con la carta adi|con carta adi|carta adi/ig, '')
        .replace(/con la carta pipino|con carta pipino|carta pipino/ig, '')
        .replace(/in contanti|con contanti/ig, '')
        .replace(/da\s+/ig, 'da ')
        .replace(/\s+/g, ' ')
        .trim();

      if (!descrizione) descrizione = 'Spesa';

      document.getElementById('descrizione').value =
        descrizione.charAt(0).toUpperCase() + descrizione.slice(1);
      document.getElementById('importo').value = importo;

      if (minuscola.includes('carta adi')) {
        document.getElementById('conto').value = 'Carta ADI';
        document.getElementById('pagamento').value = 'Carta';
      } else if (minuscola.includes('carta pipino')) {
        document.getElementById('conto').value = 'Carta Pipino';
        document.getElementById('pagamento').value = 'Carta';
      } else if (minuscola.includes('contanti')) {
        document.getElementById('conto').value = 'Contanti';
        document.getElementById('pagamento').value = 'Contanti';
      } else {
        document.getElementById('conto').value = '';
      }

      if (minuscola.includes('entrata') || minuscola.includes('incassato')) {
        document.getElementById('tipo').value = 'Entrata';
      } else {
        document.getElementById('tipo').value = 'Uscita';
      }

      if (minuscola.includes('pewex') ||
          minuscola.includes('supermercato') ||
          minuscola.includes('spesa')) {
        document.getElementById('categoria').value = 'Alimentari';
      } else {
        document.getElementById('categoria').value = '';
      }

      modulo.style.display = 'block';
      messaggio.textContent = 'Ho capito: ' + frase +
        '\nControlla e correggi i dati prima di confermare.';
    }

    document.getElementById('microfono').addEventListener('click', () => {
      const Riconoscimento =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!Riconoscimento) {
        messaggio.textContent =
          'Il riconoscimento vocale non è disponibile. Prova con Google Chrome.';
        return;
      }

      const ascolto = new Riconoscimento();
      ascolto.lang = 'it-IT';
      ascolto.interimResults = false;
      ascolto.maxAlternatives = 1;

      messaggio.textContent = 'Ti ascolto...';

      ascolto.onresult = (evento) => {
        analizzaFrase(evento.results[0][0].transcript);
      };

      ascolto.onerror = (evento) => {
        messaggio.textContent = 'Problema con il microfono: ' + evento.error;
      };

      ascolto.start();
    });

    document.getElementById('conferma').addEventListener('click', () => {
      const descrizione = document.getElementById('descrizione').value.trim();
      const importo = Number(document.getElementById('importo').value);
      const conto = document.getElementById('conto').value;

      if (!descrizione || !Number.isFinite(importo) || importo <= 0 || !conto) {
        messaggio.textContent =
          'Controlla i dati: inserisci descrizione, importo e conto.';
        return;
      }

      messaggio.textContent =
        'Dati confermati sul sito, ma NON ancora salvati nel foglio Google.\n\n' +
        'Descrizione: ' + descrizione +
        '\nImporto: ' + importo.toFixed(2) + ' €' +
        '\nTipo: ' + document.getElementById('tipo').value +
        '\nCategoria: ' + document.getElementById('categoria').value +
        '\nPagamento: ' + document.getElementById('pagamento').value +
        '\nConto: ' + conto +
        '\n\nIl collegamento sicuro al foglio sarà il passaggio successivo.';
    });
  </script>
</body>
</html>
